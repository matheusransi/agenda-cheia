<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda Cheia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d5f6a'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <span class="brand">Agenda Cheia</span>
      <label class="clinic-pick">
        <span class="sr-only">Clínica</span>
        <select id="clinic-select"></select>
      </label>
      <nav class="tabs">
        <a href="#painel" data-view="painel">Painel</a>
        <a href="#config" data-view="config">Configurações</a>
      </nav>
      <button type="button" class="btn ghost" id="logout">Sair</button>
    </div>
  </header>
  <main class="wrap" id="app"></main>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
