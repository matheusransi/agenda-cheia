<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agenda Cheia</title>
  <link rel="icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#0b3a40">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda Cheia">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
  <div class="shell" id="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Agenda Cheia</span></div>
      <label class="clinic-switch">
        <span class="side-label">Clínica</span>
        <select id="clinic-select" aria-label="Clínica"></select>
      </label>
      <nav class="side-nav" id="side-nav"></nav>
      <div class="side-foot">
        <span class="mode-pill" id="mode-pill" hidden></span>
        <button type="button" class="side-link" id="theme-side"></button>
        <button type="button" class="side-link" id="logout"></button>
      </div>
    </aside>

    <header class="mobile-head">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span></div>
      <select id="clinic-select-m" aria-label="Clínica"></select>
      <span class="mode-pill small" id="mode-pill-m" hidden></span>
      <button type="button" class="theme-btn" id="theme-m"></button>
    </header>

    <main class="main" id="app"></main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <main class="auth" id="auth" hidden></main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Conversa"></aside>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
