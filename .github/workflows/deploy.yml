name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Conferir acesso ao Cloudflare
        id: check
        run: |
          if [ -z "$CF_TOKEN_RAW" ] || [ -z "$CF_ACCOUNT_RAW" ]; then
            echo "::warning::Publicação pulada: configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions (veja o README)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Aceita o ID colado com espaços, quebras de linha ou dentro do endereço do painel.
          ACCOUNT=$(printf '%s' "$CF_ACCOUNT_RAW" | grep -oE '[0-9a-fA-F]{32}' | head -1)
          if [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID inválido: deve ter 32 letras e números (ex.: 3f2a9c8e7b6d5a4f1e0d9c8b7a6f5e4d). Copie de novo em Workers & Pages > Account details."
            exit 1
          fi
          TOKEN=$(printf '%s' "$CF_TOKEN_RAW" | tr -d '[:space:]')
          echo "::add-mask::$ACCOUNT"
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - name: Criar ou localizar o banco de dados
        if: steps.check.outputs.skip != 'true'
        run: node scripts/ci-prepare.mjs
      - name: Atualizar tabelas do banco
        if: steps.check.outputs.skip != 'true'
        run: npx wrangler d1 migrations apply agenda-cheia --remote
      - name: Publicar o sistema
        if: steps.check.outputs.skip != 'true'
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -n "$URL" ]; then echo "### Portal publicado: $URL" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Enviar senhas e chaves para o Cloudflare
        if: steps.check.outputs.skip != 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
        run: node scripts/ci-secrets.mjs
